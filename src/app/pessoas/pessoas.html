
<h2>Cadastro de Clientes</h2>

<form (ngSubmit)="cadastrarPessoa()">
  <label>Nome:</label>
  <input type="text" name="nome" [(ngModel)]="nome" required>

  <label>CPF:</label>
  <input
    type="text"
    name="cpf"
    [(ngModel)]="cpf"
    maxlength="11"
    placeholder="Digite os 11 números do CPF"
    required>

  <label>Data de nascimento:</label>
  <input type="date" name="dataNascimento" [(ngModel)]="dataNascimento" required>

  <label>Sexo:</label>
  <input type="text" name="sexo" [(ngModel)]="sexo" maxlength="1" required>

  <label>E-mail:</label>
  <input type="email" name="email" [(ngModel)]="email" required>

  <label>Telefone:</label>
  <input
    type="text"
    name="telefone"
    [(ngModel)]="telefone"
    placeholder="Digite o telefone"
    required>

  <label>Status:</label>
  <select name="ativoPessoa" [(ngModel)]="ativoPessoa" required>
    <option value="">Selecione o status</option>
    <option value="S">Ativo</option>
    <option value="N">Inativo</option>
  </select>

  <button type="submit">Cadastrar cliente</button>

  <p class="mensagem">{{ mensagem }}</p>
</form>
