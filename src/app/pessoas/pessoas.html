<h2>Cadastro de Clientes</h2>

<form (ngSubmit)="cadastrarPessoa()">

  <label>Nome:</label>
  <input
    type="text"
    name="nome"
    [(ngModel)]="nome"
    placeholder="Digite o nome completo"
    required>

  <label>CPF:</label>
  <input
    type="text"
    name="cpf"
    [(ngModel)]="cpf"
    maxlength="11"
    placeholder="Digite os 11 números do CPF"
    required>

  <label>Data de nascimento:</label>
  <input
    type="date"
    name="dataNascimento"
    [(ngModel)]="dataNascimento"
    required>

  <label>Sexo:</label>
  <select name="sexo" [(ngModel)]="sexo" required>
    <option value="">Selecione o sexo</option>
    <option value="M">Masculino</option>
    <option value="F">Feminino</option>
  </select>

  <label>E-mail:</label>
  <input
    type="email"
    name="email"
    [(ngModel)]="email"
    placeholder="exemplo@email.com"
    required>

  <label>Telefone:</label>
  <input
    type="text"
    name="telefone"
    [(ngModel)]="telefone"
    maxlength="11"
    placeholder="DDD + número"
    required>

  <label>Status:</label>
  <select name="ativoPessoa" [(ngModel)]="ativoPessoa" required>
    <option value="">Selecione o status</option>
    <option value="S">Ativo</option>
    <option value="N">Inativo</option>
  </select>

  <h3>Endereço</h3>

  <label>CEP:</label>
  <input
    type="text"
    name="cep"
    [(ngModel)]="cep"
    maxlength="8"
    placeholder="Digite o CEP"
    required>

  <label>Logradouro:</label>
  <input
    type="text"
    name="logradouro"
    [(ngModel)]="logradouro"
    placeholder="Rua, avenida..."
    required>

  <label>Número:</label>
  <input
    type="text"
    name="numero"
    [(ngModel)]="numero"
    placeholder="Número da residência"
    required>

  <label>Complemento:</label>
  <input
    type="text"
    name="complemento"
    [(ngModel)]="complemento"
    placeholder="Apartamento, bloco...">

  <label>Bairro:</label>
  <input
    type="text"
    name="bairro"
    [(ngModel)]="bairro"
    placeholder="Digite o bairro"
    required>

  <label>Cidade:</label>
  <input
    type="text"
    name="cidade"
    [(ngModel)]="cidade"
    placeholder="Digite a cidade"
    required>

  <label>UF:</label>
  <input
    type="text"
    name="uf"
    [(ngModel)]="uf"
    maxlength="2"
    placeholder="Ex.: SE"
    required>

  <button type="submit">Cadastrar cliente</button>

  <p class="mensagem">{{ mensagem }}</p>

</form>
