
<header class="topo">

  <button class="botao-contato" routerLink="/contato">
    Fale conosco
  </button>

  <nav>
    <a routerLink="/">Início</a>
    <a routerLink="/servicos">Serviços</a>
    <a routerLink="/produtos">Produtos</a>
    <a routerLink="/sobre">Sobre nós</a>
    <a routerLink="/pessoas">Cadastro clientes</a>
    <a routerLink="/funcionarios">Funcionários</a>
    <a routerLink="/administrador">Área administrativa</a>

    <a routerLink="/carrinho" class="icone-carrinho" aria-label="Carrinho" title="Carrinho">

      <svg xmlns="http://www.w3.org/2000/svg"
           width="23" height="23" viewBox="0 0 24 24"
           fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/>
        <circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>

      <span class="contador-carrinho"
            [hidden]="quantidadeItens === 0">
        {{ quantidadeItens }}
      </span>

    </a>
  </nav>

</header>

<main>
  <router-outlet />
</main>

<footer>
  <p>2026 - Estética & Bem-Estar</p>
</footer>
