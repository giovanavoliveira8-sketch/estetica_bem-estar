
<section class="secao">
  <h2>Nossos serviços</h2>
  <p>Encontre o cuidado ideal para você.</p>

  <div class="filtros">
    <button
      *ngFor="let categoria of categorias"
      (click)="filtrarCategoria(categoria)"
      [class.selecionado]="categoriaSelecionada === categoria">
      {{ categoria }}
    </button>
  </div>

  <p *ngIf="mensagem">{{ mensagem }}</p>

  <div class="grade">
    <div class="cartao" *ngFor="let servico of servicosFiltrados">
      <h3>{{ servico.item1 }}</h3>

      <p>{{ servico.descricaoItem }}</p>

      <p>
        <strong>Categoria:</strong>
        {{ servico.idcategoriaNavigation?.categoria }}
      </p>

      <p>
        <strong>Preço:</strong>
        {{ servico.preco }}
      </p>
    </div>
  </div>

  <p *ngIf="servicos.length > 0 && servicosFiltrados.length === 0">
    Nenhum serviço encontrado nessa categoria.
  </p>
</section>
