
<h2>Cadastro de Funcionários</h2>

<form (ngSubmit)="cadastrarFuncionario()">

  <label>Nome:</label>
  <input type="text" name="nome" [(ngModel)]="nome" required>

  <label>CPF:</label>
  <input
    type="text"
    name="cpf"
    [(ngModel)]="cpf"
    maxlength="11"
    placeholder="Digite os 11 números do CPF"
    required>

  <label>Data de nascimento:</label>
  <input type="date" name="dataNascimento" [(ngModel)]="dataNascimento" required>

  <label>Sexo:</label>
  <input type="text" name="sexo" [(ngModel)]="sexo" maxlength="1" required>

  <label>E-mail:</label>
  <input type="email" name="email" [(ngModel)]="email" required>

  <label>Telefone:</label>
  <input
    type="text"
    name="telefone"
    [(ngModel)]="telefone"
    placeholder="Digite o telefone"
    required>

  <label>Status:</label>
  <select name="ativoPessoa" [(ngModel)]="ativoPessoa" required>
    <option value="">Selecione o status</option>
    <option value="S">Ativo</option>
    <option value="N">Inativo</option>
  </select>

  <label>Cargo:</label>
  <input type="text" name="cargo" [(ngModel)]="cargo" required>

  <label>Data de admissão:</label>
  <input type="date" name="dataAdmissao" [(ngModel)]="dataAdmissao" required>

  <label>CEP:</label>
  <input type="text" name="cep" [(ngModel)]="cep" required>

  <label>Número:</label>
  <input type="text" name="numero" [(ngModel)]="numero" required>

  <label>Complemento:</label>
  <input type="text" name="complemento" [(ngModel)]="complemento">

  <button type="submit">
    {{ idPessoaEdicao === null ? 'Cadastrar funcionário' : 'Salvar alterações' }}
  </button>

  <button
    type="button"
    *ngIf="idPessoaEdicao !== null"
    (click)="limparFormulario()">
    Cancelar edição
  </button>

  <p class="mensagem">{{ mensagem }}</p>
</form>

<h2>Funcionários cadastrados</h2>

<div *ngFor="let funcionario of funcionarios">
  <p>Nome: {{ funcionario.nome }}</p>
  <p>CPF: {{ funcionario.cpf }}</p>
  <p>Cargo: {{ funcionario.cargo }}</p>
  <p>Data de admissão: {{ funcionario.dataAdmissao }}</p>
  <p>Status: {{ funcionario.ativoPessoa === 'S' ? 'Ativo' : 'Inativo' }}</p>

  <button type="button" (click)="editarFuncionario(funcionario)">
    Editar
  </button>

  <button type="button" (click)="excluirFuncionario(funcionario.idPessoa)">
    Excluir
  </button>

  <hr>
</div>
